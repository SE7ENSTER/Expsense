name: Verify and Deploy SLG Expense

on:
  push:
    branches: [main]
    paths:
      [
        "docs/**",
        "functions/**",
        "tests/**",
        "package.json",
        ".github/workflows/deploy.yml",
        "firestore.rules",
        "firebase*.json",
        "backups/**",
        "RELEASE_RULES_20261110.md",
      ]
  pull_request:
    paths:
      [
        "docs/**",
        "functions/**",
        "tests/**",
        "package.json",
        ".github/workflows/deploy.yml",
        "firestore.rules",
        "firebase*.json",
        "backups/**",
        "RELEASE_RULES_20261110.md",
      ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: slg-expense-${{ github.event.pull_request.number || 'production' }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install isolated test dependency
        run: npm install --prefix "$RUNNER_TEMP/slg-tests" --no-save --package-lock=false --ignore-scripts linkedom@0.18.12
      - name: Verify production imports, syntax, and assets
        run: node tests/check-production.cjs
      - name: Run dashboard and production-module integration tests
        env:
          NODE_PATH: ${{ runner.temp }}/slg-tests/node_modules
        run: npm test

  verify-print-layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install isolated print test dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/slg-print" --no-save --package-lock=false --ignore-scripts linkedom@0.18.12
          python -m pip install --disable-pip-version-check PyMuPDF==1.26.6 Pillow==13.0.0
      - name: Verify actual Chrome PDF pages and receipt bounds
        env:
          NODE_PATH: ${{ runner.temp }}/slg-print/node_modules
        run: python tests/report-print-pdf.py
      - name: Keep synthetic PDF layout evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: receipt-print-layout
          path: |
            .test-output/receipt-print/*.pdf
            .test-output/receipt-print/*.png
            .test-output/receipt-print/print-layout-results.json
          retention-days: 7

  verify-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install isolated Firebase test tools
        run: npm install --prefix "$RUNNER_TEMP/slg-rules" --no-save --package-lock=false --ignore-scripts firebase-tools@15.35.0 @firebase/rules-unit-testing@6.0.0 firebase@13.2.0 linkedom@0.18.12
      - name: Verify rules in isolated Firestore Emulator
        env:
          NODE_PATH: ${{ runner.temp }}/slg-rules/node_modules
        run: |
          export PATH="$RUNNER_TEMP/slg-rules/node_modules/.bin:$PATH"
          npm run test:release:rules

  verify-account-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install pinned Server dependencies
        run: npm ci --prefix functions --ignore-scripts
      - name: Verify email configuration and password policy
        run: npm run test:security:unit
      - name: Install isolated emulator client tools
        run: npm install --prefix "$RUNNER_TEMP/slg-security" --no-save --package-lock=false --ignore-scripts firebase-tools@15.35.0 firebase@13.2.0
      - name: Verify callable password workflow with Auth and Firestore rules
        env:
          NODE_PATH: ${{ runner.temp }}/slg-security/node_modules
        run: |
          export PATH="$RUNNER_TEMP/slg-security/node_modules/.bin:$PATH"
          npm run test:security

  deploy:
    if: github.event_name != 'pull_request'
    needs: [verify, verify-rules, verify-account-security, verify-print-layout]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs
      - id: deployment
        uses: actions/deploy-pages@v4
